<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XYZBOOK Fantasy Matches — Design Prototype</title>
<style>
:root{color-scheme:dark;--bg:#071525;--card:#11253a;--line:#294057;--lime:#c5ff4b;--muted:#9db0c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f9ff;font:16px system-ui,-apple-system,sans-serif}.app{max-width:470px;margin:auto;min-height:100dvh;padding:24px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;font-weight:900;letter-spacing:2px;color:var(--lime)}.demo{border:1px solid #526378;color:#d2dce7;border-radius:6px;padding:4px 7px;font-size:11px}.heading{margin:28px 0 6px;font-size:30px;line-height:1.1;letter-spacing:-.8px}.sub{color:var(--muted);font-size:14px;margin:0 0 22px}.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{background:#14263a;border:1px solid var(--line);border-radius:12px;padding:11px 18px;color:#d9e4ef;font-weight:700}.tab[aria-selected=true]{background:var(--lime);border-color:var(--lime);color:#102117}.section{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:#c4d3e3;margin:26px 0 12px}.match{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.status{font-weight:800;color:var(--lime)}.teams{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 18px}.team{display:flex;flex-direction:column;gap:5px;min-width:0}.team.right{text-align:right}.name{font-size:23px;font-weight:850;letter-spacing:-.4px}.score{font-size:12px;color:var(--muted)}.vs{font-size:11px;color:#8196ac;font-weight:800}.cta{width:100%;padding:14px;background:var(--lime);border:0;border-radius:11px;color:#0b1c11;font-size:15px;font-weight:850}.cta:focus-visible,.tab:focus-visible{outline:3px solid white;outline-offset:3px}.foot{font-size:12px;color:#a9b8c7;line-height:1.5;margin-top:18px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0c1d2f;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:14px 0 max(14px,env(safe-area-inset-bottom))}.nav span{font-size:12px;color:#9cafc3}.nav .active{color:var(--lime);font-weight:800}@media(min-width:500px){.nav{max-width:470px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}}@media(max-width:360px){.heading{font-size:27px}.name{font-size:21px}.match{padding:15px}}
</style></head><body><main class="app"><div class="top"><div class="brand">XYZBOOK</div><span class="demo">DEMO MODE</span></div><h1 class="heading">Fantasy Matches</h1><p class="sub">Choose a match. Build your best XI.</p><div class="tabs" role="tablist" aria-label="Match filter"><button class="tab" role="tab" aria-selected="true" data-filter="all">All matches</button><button class="tab" role="tab" aria-selected="false" data-filter="upcoming">Upcoming</button></div><div id="matches"></div><p class="foot">All fixtures and match information on this page are simulated. This is a standalone visual prototype, not a connected fantasy app.</p></main><nav class="nav" aria-label="Demo navigation"><span>Home</span><span class="active">Fantasy</span><span>Markets</span><span>Activity</span><span>Profile</span></nav>
<script>
const fixtures=[{a:"IND",b:"AUS",title:"India vs Australia",date:"Today · 7:30 PM",state:"upcoming"},{a:"PAK",b:"NZ",title:"Pakistan vs New Zealand",date:"Tomorrow · 3:00 PM",state:"upcoming"},{a:"WI",b:"BAN",title:"West Indies vs Bangladesh",date:"Demo fixture",state:"upcoming"},{a:"ZIM",b:"AFG",title:"Zimbabwe vs Afghanistan",date:"Demo fixture",state:"upcoming"}];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(filter="all"){let list=fixtures.filter(m=>filter==="all"||m.state===filter);document.getElementById("matches").innerHTML='<div class="section">Upcoming matches · Simulated</div>'+list.map(m=>'<article class="match"><div class="meta"><span>'+escapeHTML(m.title)+'</span><span class="status">UPCOMING · DEMO</span></div><div class="teams"><div class="team"><span class="name">'+escapeHTML(m.a)+'</span><span class="score">Select 11 players</span></div><span class="vs">VS</span><div class="team right"><span class="name">'+escapeHTML(m.b)+'</span><span class="score">'+escapeHTML(m.date)+'</span></div></div><button class="cta" type="button" data-match="'+escapeHTML(m.a)+'-'+escapeHTML(m.b)+'">Create Team</button></article>').join('');}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));render(t.dataset.filter)}));document.addEventListener("click",e=>{let b=e.target.closest("[data-match]");if(b)alert("Visual prototype only. Integrate Create Team with the existing XYZBOOK route for "+b.dataset.match+".")});render();
</script></body></html>
